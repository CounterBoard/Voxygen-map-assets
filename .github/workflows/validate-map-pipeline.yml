name: Validate world-map pipeline

on:
  push:
    branches:
      - feature/coordinate-system-manifest
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processor
        run: python -m pip install --upgrade Pillow

      - name: Check Python syntax
        run: python -m py_compile tools/build_map.py

      - name: Test coordinate geometry
        run: python tests/test_build_map.py
