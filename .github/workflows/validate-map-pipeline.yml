name: Validate world-map pipeline

on:
  push:
    branches:
      - main
      - feature/coordinate-system-manifest
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processor
        run: python -m pip install --upgrade Pillow requests

      - name: Run map pipeline unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
