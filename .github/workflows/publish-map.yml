name: Process and publish world map

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public GitHub Release asset URL of the uploaded source map"
        required: true
        type: string
      map_version:
        description: "Unique map version identifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: world-map-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pipeline
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image processor
        run: python -m pip install --upgrade Pillow requests

      - name: Download uploaded source map
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          MAP_SOURCE_GITHUB_TOKEN: ${{ secrets.MAP_SOURCE_GITHUB_TOKEN }}
        run: |
          mkdir -p work
          python tools/download_release_asset.py "$IMAGE_URL" work/source-map
      - name: Generate Deep Zoom tiles and manifest
        env:
          MAP_VERSION: ${{ inputs.map_version }}
        run: python tools/build_map.py work/source-map public

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Publish static map assets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.162.0 deploy

      - name: Report published version
        run: |
          echo "Published map version: ${{ inputs.map_version }}" >> "$GITHUB_STEP_SUMMARY"
