name: Process and publish world map

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public GitHub Release asset URL of the uploaded source map"
        required: true
        type: string
      map_version:
        description: "Unique map version identifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: world-map-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pipeline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processor
        run: python -m pip install --upgrade Pillow requests

      - name: Download uploaded source map
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          MAP_SOURCE_GITHUB_TOKEN: ${{ secrets.MAP_SOURCE_GITHUB_TOKEN }}
        run: |
          mkdir -p work
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          import requests

          url = os.environ["IMAGE_URL"]
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "github.com":
              raise SystemExit("The source image must be a HTTPS GitHub Release asset URL")

          headers = {
              "User-Agent": "Voxygen-Map-Pipeline/1.0",
              "Accept": "application/octet-stream",
          }
          token = os.environ.get("MAP_SOURCE_GITHUB_TOKEN", "").strip()
          if token:
              headers["Authorization"] = f"Bearer {token}"

          response = requests.get(url, headers=headers, stream=True, allow_redirects=False, timeout=(30, 300))
          if response.is_redirect:
              download_url = response.headers.get("Location")
              response.close()
              if not download_url or urlparse(download_url).scheme != "https":
                  raise SystemExit("GitHub returned an invalid or insecure download redirect")
              # The bearer token is deliberately not forwarded to the signed asset host.
              response = requests.get(
                  download_url,
                  headers={"User-Agent": "Voxygen-Map-Pipeline/1.0"},
                  stream=True,
                  allow_redirects=True,
                  timeout=(30, 300),
              )
          response.raise_for_status()
          with open("work/source-map", "wb") as output:
              for chunk in response.iter_content(chunk_size=1024 * 1024):
                  if chunk:
                      output.write(chunk)
          response.close()
          if not os.path.getsize("work/source-map"):
              raise SystemExit("The downloaded source image is empty")
          PY
      - name: Generate Deep Zoom tiles and manifest
        env:
          MAP_VERSION: ${{ inputs.map_version }}
        run: python tools/build_map.py work/source-map public

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish static map assets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest deploy

      - name: Report published version
        run: |
          echo "Published map version: ${{ inputs.map_version }}" >> "$GITHUB_STEP_SUMMARY"
